services:

##### Constraint guesser
  Austral\FormBundle\Constraint\DoctrineConstraintGuesser:
    arguments:
      $registry: '@?doctrine'

  Austral\FormBundle\Constraint\ConstraintGuesserInterface:
    alias: Austral\FormBundle\Constraint\DoctrineConstraintGuesser

  austral.form.constraint_guesser:
    alias: Austral\FormBundle\Constraint\DoctrineConstraintGuesser
    public: true

##### Form type and extension
  Austral\FormBundle\Form\Type\AustralFormType:
    arguments:
      $constraintGuesser: '@Austral\FormBundle\Constraint\ConstraintGuesserInterface'
    tags:
      - { name: form.type }

  Austral\FormBundle\Form\Extension\PresentationTypeExtension:
    tags:
      - { name: form.type_extension }
